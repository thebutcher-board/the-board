<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f10">
<title>THE BOARD</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <img class="logo" src="logo.png" alt="The Butcher bull logo">
  <div class="brand"><h1>THE BOARD</h1><p>WIN BEFORE THE CLOCK STARTS.</p></div>
  <button id="settingsBtn" class="icon-btn" aria-label="Draft settings">⚙</button>
</header>
<nav class="tabs" aria-label="Main navigation">
  <button class="tab active" data-view="warroom">War Room</button>
  <button class="tab" data-view="board">Board</button>
  <button class="tab" data-view="league">League</button>
  <button class="tab" data-view="history">History</button>
</nav>
<main>
<section id="warroom" class="view active">
  <div class="clock panel"><div><span class="eyebrow">ON THE CLOCK</span><h2 id="clockTeam">—</h2><p id="clockPick">—</p></div><div class="pick-badge" id="pickBadge">1</div></div>
  <div class="panel recommendation"><span class="eyebrow">RECOMMENDED PICK</span><div id="recommend"></div></div>
  <div class="panel"><div class="panel-head"><h3>Next Five</h3><button class="text-btn" data-jump="board">View board</button></div><div id="nextFive" class="stack"></div></div>
  <div class="panel"><div class="panel-head"><h3>The Butcher Roster</h3><span class="pill">5 Keepers</span></div><div id="myRoster" class="roster-list"></div></div>
</section>
<section id="board" class="view">
  <div class="panel"><div class="panel-head"><div><span class="eyebrow">LIVE DRAFT BOARD</span><h2>The Butcher 50</h2></div><span id="availableCount" class="pill"></span></div>
  <div class="filters"><input id="boardSearch" type="search" placeholder="Search player or team"><select id="boardPos"><option value="ALL">All positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option></select></div>
  <div id="boardTable" class="player-list"></div></div>
</section>
<section id="league" class="view"><div class="panel"><div class="panel-head"><div><span class="eyebrow">LEAGUE ROOM</span><h2>All Rosters</h2></div></div><div id="rosters" class="team-grid"></div></div></section>
<section id="history" class="view"><div class="panel"><div class="panel-head"><div><span class="eyebrow">DRAFT LOG</span><h2>Pick History</h2></div><button id="undoBtn" class="btn secondary">Undo Last</button></div><div id="draftHistory"></div></div></section>
</main>
<div id="settingsModal" class="modal" hidden><div class="modal-card"><h2>Draft Settings</h2><label>The Butcher draft slot<select id="slotSelect"></select></label><div class="modal-actions"><button id="closeSettings" class="btn secondary">Cancel</button><button id="saveSettings" class="btn primary">Save</button></div><button id="resetBtn" class="danger-link">Reset entire draft</button></div></div>
<div id="toast" class="toast" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
